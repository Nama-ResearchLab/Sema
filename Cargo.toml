[package]
name = "sema"
version = "0.2.0"
edition = "2024"
description = "Sema - offline semantic anchoring for low-resource languages. Distilled Wiktionary lexicons + morphology-aware word resolution and slot synthesis. No cloud, no model."
license = "MIT"
repository = "https://github.com/Nama-ResearchLab/Sema"
keywords = ["swahili", "nlp", "lexicon", "morphology", "low-resource"]
categories = ["text-processing", "internationalization"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "sema"
path = "src/bin/sema.rs"

[[bin]]
name = "sema-gui"
path = "src/bin/sema_gui.rs"

[[bin]]
name = "sema_cc"
path = "src/bin/sema_cc.rs"

[[bin]]
name = "sema-distill"
path = "src/bin/sema-distill.rs"

[profile.release]
opt-level = 3
lto = "thin"



