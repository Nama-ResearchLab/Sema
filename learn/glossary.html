<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Sema (v0.2.5): glossary</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230D9488'/><text x='50' y='67' font-size='56' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'>S</text></svg>">
<style>
body{font-family:Georgia,serif;max-width:48em;margin:2em auto;padding:0 1em;line-height:1.8;color:#1e293b}
h1{font-family:Verdana,sans-serif;color:#0f172a}
.t{position:relative;border-bottom:1px dotted #0f766e;cursor:help;white-space:nowrap;font-weight:bold}
.t::after{content:attr(data-d);display:none;position:absolute;left:0;bottom:130%;width:18em;white-space:normal;background:#0f172a;color:#fff;padding:.5em .75em;border-radius:6px;font-size:.88em;line-height:1.4;font-weight:normal;z-index:5}
.t:hover::after,.t.pin::after{display:block}
li{margin:.35em 0}
img.logo{height:48px}
@media print{.t::after{display:none}}
</style>
</head>
<body>
<img class="logo" src="assets/nama-logo.png" alt="Nama Research Lab">
<h1>Glossary (v0.2.5 — hover any term)</h1>
<p>Tap any term on touch screens to pin its definition. Full lessons in <a href="index.html">course hub</a> and <a href="01-first-principles.md">Lesson 1</a>.</p>
<ul id="terms"></ul>
<p><a href="index.html">Back to course hub</a></p>
<script>
var G=[
["Morphology","how words are built from smaller meaningful parts."],
["Morpheme","one meaningful part, e.g. si (not, I) inside sikufanya."],
["Root","the verb core carrying meaning, e.g. fanya (do). Also called stem."],
["Lemma","the dictionary headword, e.g. fikia for umefikia."],
["Affix","a part glued to the front (prefix) or back (suffix) of a root."],
["Concord","noun-class or person agreement marker (1SG ni-, C7 ki-, C8 vi-)."],
["Agglutination","building words by stacking prefixes, infixes, and suffixes in fixed slot order."],
["TAM","tense, aspect, mood slot: li past, na present, me perfect, ta/taka future."],
["Relative infix","Slot 2b marker (-ye-, -o-, -cho-, -po-) shifting future -ta- to -taka- (watakaojibu)."],
["Conditional","hypothetical/counterfactual TAM: -ki- (if), -nge- (would), -ngali- (would have), negative -sipo-/-singe-."],
["ConcordEngine","v0.2.5 non-verbal engine generating copulas (yuko), adjectives (kidogo), numerals, possessives, demonstratives, and -ni locatives."],
["Composer","v0.2.5 deterministic template engine compiling {t:child} {poss:@child|1SG} {loc_cop:@child|ko} -> mtoto wangu yuko."],
["Decomposer","pure-Rust forward parser peeling prefixes/relatives/derivations from sw.toml and verifying exact round-trips."],
["FactGuardian","v0.2.5 zero-leak clinical & numeric protector covering decimals, ranges, Swahili number words, brands, and drug typos."],
["Damerau-Levenshtein","bounded edit distance (allows single adjacent letter swaps) used by FactGuardian to catch misspelled generics like paracetemol."],
["Intent","structured request to build a verb: subject, tense, polarity, relative, object, root, derivations, mood."],
["Surface form","the final spelled word, e.g. watakaojibu or sikufanya."],
["Subjunctive","mood with final -e, used for polite requests and purpose."],
["Passive","derivation -w-/-iwa/-liwa: the action happens to the subject (ilifunguliwa)."],
["Applicative","derivation -i-/-e-/-li-: doing for or to someone (alimwandikia)."],
["Causative","derivation -ish-/-esh-/-z-: making something happen (ninasomesha)."],
["Reciprocal","derivation -an-: doing to each other (tunaonana)."],
["Stative","derivation -ik-/-ek-: being in a state (imevunjika)."]
];
var ul=document.getElementById("terms");
G.forEach(function(g){
  var li=document.createElement("li");
  var s=document.createElement("span");
  s.className="t";s.tabIndex=0;s.textContent=g[0];s.setAttribute("data-d",g[1]);
  s.onclick=function(){var p=s.className.indexOf("pin")>=0;s.className="t"+(p?"":" pin");};
  li.appendChild(s);ul.appendChild(li);
});
</script>
</body>
</html>
